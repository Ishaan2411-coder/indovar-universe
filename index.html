<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Indovar Universe | Phase 1</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== Animated Space Background ===== -->
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="nebula"></div>

    <!-- ===== Navbar ===== -->
    <header>
        <div class="logo">INDOVAR UNIVERSE</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Phase 1</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- ===== Hero Section ===== -->
    <section class="hero">
        <h1 class="glow-text">COMING SOON</h1>
        <p>Phase 1 Announcement Countdown</p>

        <!-- Countdown -->
        <div class="countdown">
            <div>
                <span id="days">00</span>
                <small>Days</small>
            </div>
            <div>
                <span id="hours">00</span>
                <small>Hours</small>
            </div>
            <div>
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>
            <div>
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>
        </div>
    </section>

    <!-- ===== Phase 1 Section ===== -->
    <section class="phase">
        <h2>PHASE 1 ANNOUNCEMENT</h2>
        <p>The universe is expanding. Stay tuned for something extraordinary.</p>

        <div class="socials">
            <a href="#">YouTube</a>
            <a href="#">Instagram</a>
            <a href="#">Email</a>
        </div>
    </section>

    <!-- JS File -->
    <script src="script.js"></script>

</body>
</html>
